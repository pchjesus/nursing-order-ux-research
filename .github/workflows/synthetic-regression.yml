name: Nursing Order UX synthetic regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# B+ CI: cancel superseded PR attempts only; retain protected main checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: B+ change scope
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Classify changed files
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          bash scripts/ci-scope.sh --self-test
          bash scripts/ci-scope.sh

  unit:
    needs: scope
    if: needs.scope.outputs.tier == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Node regression tests
        run: |
          set -eu
          for f in tests/*.test.js; do
            echo "Running $f"
            node "$f"
          done
      - name: Print and validate isolated pilot CLI output
        run: node research/pilot-case-model.cjs
  browser:
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          if [ -z "$CHROME" ]; then CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' -print -quit)"; fi
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Run all injected-DOM Chromium smoke tests
        run: |
          set -eu
          for f in tests/*browser*.py; do
            echo "Running $f"
            python "$f"
          done
      - name: Save optional pilot viewer screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-pilot-review-v0.2.7
          path: docs/ui-pilot-v0.2.7.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Save root start-page screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-order-start-page
          path: docs/ui-root-landing.png
          if-no-files-found: ignore
          retention-days: 30
