name: Capture actual v0.2.6 UI screenshots
on:
  push:
    branches: [main]
    paths:
      - tests/capture_real_ui.py
      - .github/workflows/real-ui-screenshot.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          if [ -z "$CHROME" ]; then CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' -print -quit)"; fi
          test -n "$CHROME"
          sudo ln -sf "$CHROME" /usr/bin/chromium
      - name: Render actual app UI
        run: python tests/capture_real_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nursing-order-real-ui-v0.2.6
          path: real-ui-captures/*.png
          if-no-files-found: error
          retention-days: 30
